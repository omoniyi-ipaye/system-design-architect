name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project validation
        run: python scripts/validate_skill.py
      - name: Install Agent Skills reference validator
        run: pip install skills-ref==0.1.1
      - name: Agent Skills specification validation
        run: |
          python - <<'PY'
          from pathlib import Path
          from skills_ref import validate
          root = Path.cwd().resolve()
          problems = validate(root)
          if problems:
              print("Agent Skills validation failed:")
              for problem in problems:
                  print(f"- {problem}")
              raise SystemExit(1)
          print("Agent Skills validation passed.")
          PY
      - name: Validate eval JSON
        run: python -m json.tool evals/evals.json >/dev/null
