name: Validate full skill plugin and optional app

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Project validation
        run: python scripts/validate_skill.py

      - name: Canonical model validation
        run: python scripts/validate_model.py model/system.example.json

      - name: Renderer smoke test
        run: |
          python scripts/render_system.py model/system.example.json --out /tmp/system-views.html
          test -s /tmp/system-views.html
          grep -q "AS-IS" /tmp/system-views.html
          grep -q "TARGET" /tmp/system-views.html
          grep -q "Adaptive loop" /tmp/system-views.html
          grep -q "Granular build specification" /tmp/system-views.html

      - name: Install Agent Skills reference validator
        run: pip install skills-ref==0.1.1

      - name: Validate root skill and bundled full skill
        run: |
          python - <<'PY'
          from pathlib import Path
          from skills_ref import validate

          for root in [Path.cwd().resolve(), Path('plugin/skills/system-design-architect').resolve()]:
              problems = validate(root)
              if problems:
                  print(f"Agent Skills validation failed for {root}:")
                  for problem in problems:
                      print(f"- {problem}")
                  raise SystemExit(1)
              print(f"Agent Skills validation passed for {root}.")
          PY

      - name: Validate plugin bundle completeness
        run: |
          python - <<'PY'
          from pathlib import Path
          import filecmp
          import json

          bundle = Path('plugin/skills/system-design-architect')
          required_dirs = ['references', 'templates', 'model', 'examples', 'evals', 'scripts']
          required_files = [
              'SKILL.md', 'LICENSE', 'CHANGELOG.md',
              'references/visual-first.md', 'references/daily-use.md',
              'references/build-layer.md', 'references/canonical-model.md',
              'references/adaptive-systems.md', 'references/review-matrix.md',
              'templates/SYSTEM_VIEW_PACK.md', 'templates/SYSTEM_HEALTH.md',
              'templates/ADAPTIVE_OPERATING_LOOP.md',
              'model/system.schema.json', 'model/system.example.json',
              'scripts/render_system.py', 'scripts/validate_model.py',
              'examples/non-software-employee-onboarding-system.md',
              'evals/evals.json', 'evals/visual-daily-evals.json',
          ]
          for d in required_dirs:
              if not (bundle / d).is_dir():
                  raise SystemExit(f'missing bundled directory: {d}')
          for rel in required_files:
              if not (bundle / rel).is_file():
                  raise SystemExit(f'missing bundled file: {rel}')

          if (Path('plugin') / '.mcp.json').exists() or (Path('plugin') / 'package.json').exists():
              raise SystemExit('core plugin must remain skill-only and must not require MCP/Node')

          manifest = json.loads(Path('plugin/.codex-plugin/plugin.json').read_text())
          if 'mcpServers' in manifest:
              raise SystemExit('core plugin manifest must not declare MCP servers')
          if manifest.get('skills') != './skills/':
              raise SystemExit('plugin manifest must point to bundled skills')

          if not filecmp.cmp('SKILL.md', bundle / 'SKILL.md', shallow=False):
              raise SystemExit('bundled SKILL.md has drifted from root SKILL.md')

          print('Full skill plugin bundle is complete and MCP-independent.')
          PY

      - name: Validate JSON artifacts
        run: |
          python -m json.tool evals/evals.json >/dev/null
          python -m json.tool evals/visual-daily-evals.json >/dev/null
          python -m json.tool plugin/.codex-plugin/plugin.json >/dev/null
          python -m json.tool app/.mcp.json >/dev/null
          python -m json.tool app/package.json >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install optional app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Type-check optional app server
        working-directory: app
        run: npm run check

      - name: Build optional MCP server and React widget
        working-directory: app
        run: npm run build

      - name: Verify optional app build artifacts
        run: |
          test -s app/web/dist/component.js
          test -s app/server/dist/server.js
          grep -q "System Design Architect" app/web/dist/component.js
